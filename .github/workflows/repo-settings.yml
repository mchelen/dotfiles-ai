name: repo-settings

# Applies infra/main.tf whenever it changes on main. Stateless pattern:
# the import block re-adopts the repo on every run, Terraform reconciles
# settings, and the runner's local state is discarded — no backend needed.
#
# Requires a fine-grained PAT with "Administration: read & write" on this
# repo, stored as the REPO_ADMIN_TOKEN Actions secret (the built-in
# GITHUB_TOKEN cannot administer repo settings). Until the secret exists,
# the job no-ops with a notice instead of failing.

on:
  push:
    branches: [main]
    paths: ['infra/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for admin token
        id: token
        env:
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -n "$REPO_ADMIN_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::REPO_ADMIN_TOKEN secret not set — skipping settings apply. Add a fine-grained PAT (Administration: write) as a repo Actions secret to enable."
          fi

      - uses: hashicorp/setup-terraform@v3
        if: steps.token.outputs.present == 'true'

      - name: Apply repo settings
        if: steps.token.outputs.present == 'true'
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false
