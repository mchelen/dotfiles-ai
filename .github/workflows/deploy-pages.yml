name: deploy-pages

# Publishes docs/ to GitHub Pages via the Actions deployment path
# (Settings -> Pages -> Source: "GitHub Actions").

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  # generate-instructions rewrites docs/index.html when a module changes, but a
  # push made with GITHUB_TOKEN never triggers another workflow's push event.
  # Without this the regenerated site would sit unpublished until the next
  # hand-edit of docs/.
  workflow_run:
    workflows: [generate-instructions]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
