name: generate-instructions

# Regenerates every artifact derived from defaults/ when the modules change on
# main, and proposes the result as a pull request:
#   INSTRUCTIONS.md        the full assembled block
#   INSTRUCTIONS-brief.md  one line per module, for size-capped chat fields
#   docs/index.html        each module's exact text, inside its card
#
# This runs in CI rather than as a local pre-commit hook on purpose: it is
# what makes the no-terminal install path work. A module edited through the
# GitHub web editor still produces an up-to-date INSTRUCTIONS.md, so someone
# with no local clone can always copy the current block out of their fork.
#
# It opens a pull request rather than pushing to main so that branch
# protection (see defaults/ci-gated-main.md) can be absolute — no bypass for
# bots. The pull request auto-merges once its checks are green, which keeps
# the web-editor path one step: edit a module, and the artifacts follow
# without anyone pressing a button.
#
# Why a token rather than the built-in GITHUB_TOKEN: events raised by
# GITHUB_TOKEN do not start new workflow runs, so a pull request it opened
# would have no checks — and under a required-status-check rule, no way to
# ever merge. A fine-grained PAT (Contents: write, Pull requests: write) makes
# the checks run. Until ARTIFACT_BOT_TOKEN exists the job falls back to
# pushing directly, which is the behaviour this replaces; that fallback stops
# working the moment branch protection is enabled, loudly rather than quietly.

on:
  push:
    branches: [main]
    paths:
      - 'defaults/**'
      - 'install.sh'
      - 'build-site.sh'
      - '.github/workflows/generate-instructions.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-instructions
  cancel-in-progress: false

env:
  BOT_BRANCH: bot/regenerate-artifacts
  ARTIFACTS: INSTRUCTIONS.md INSTRUCTIONS-brief.md docs/index.html

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same shape as repo-settings.yml: a step output, not a `secrets`
      # reference inside `if:`, whose availability at step level is murkier
      # than it looks.
      - name: Check for the bot token
        id: token
        env:
          ARTIFACT_BOT_TOKEN: ${{ secrets.ARTIFACT_BOT_TOKEN }}
        run: |
          if [ -n "$ARTIFACT_BOT_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate generated artifacts
        run: |
          ./install.sh --print > INSTRUCTIONS.md
          ./install.sh --brief > INSTRUCTIONS-brief.md
          ./build-site.sh

      - name: Stop if nothing changed
        id: diff
        run: |
          if git diff --quiet -- $ARTIFACTS; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Generated artifacts are already current — nothing to propose."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit to a branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BOT_BRANCH"
          git add $ARTIFACTS
          git commit -m "chore: regenerate artifacts from defaults/

          Generated by .github/workflows/generate-instructions.yml from
          ${{ github.sha }}. Do not edit these files by hand — the source of
          truth is defaults/."

      # Pushing with the PAT is what makes the pull request's checks run.
      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true' && steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.ARTIFACT_BOT_TOKEN }}
        run: |
          git push -f "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}" "$BOT_BRANCH"

          if [ -z "$(gh pr list --head "$BOT_BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BOT_BRANCH" \
              --title "chore: regenerate artifacts from defaults/" \
              --body "$(cat <<'BODY'
          `INSTRUCTIONS.md`, `INSTRUCTIONS-brief.md`, and the module text in
          `docs/index.html` are generated from `defaults/`. A module changed on
          `main`, so they are out of date; this brings them back in step.

          Opened automatically. It merges itself once checks are green — the
          point is that the artifacts pass through the same gate as everything
          else, not that anyone reviews a generated diff.
          BODY
          )"
            gh pr merge --auto --squash "$BOT_BRANCH" \
              || echo "::warning::Could not enable auto-merge — check that allow_auto_merge is on (infra/main.tf). The pull request is open and mergeable by hand."
          else
            echo "::notice::Existing pull request updated with a new push."
          fi

      # Transitional: without the PAT there is no way to open a pull request
      # whose checks run, so keep doing what this workflow used to do. Once
      # branch protection is on, this push fails and the run goes red — which
      # is the correct outcome, not a silent gap.
      - name: Fall back to pushing directly
        if: steps.diff.outputs.changed == 'true' && steps.token.outputs.present != 'true'
        run: |
          echo "::warning::ARTIFACT_BOT_TOKEN is not set — pushing to main directly. A pull request opened with the built-in GITHUB_TOKEN would have no checks and could never merge under branch protection. See the workflow header for the one-time setup."
          git checkout "${{ github.ref_name }}"
          git merge --ff-only "$BOT_BRANCH"
          git push
