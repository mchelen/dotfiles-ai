name: generate-instructions

# Regenerates every artifact derived from defaults/ whenever the modules change
# on main, and commits the result back:
#   INSTRUCTIONS.md        the full assembled block
#   INSTRUCTIONS-brief.md  one line per module, for size-capped chat fields
#   docs/index.html        each module's exact text, inside its card
#
# This runs in CI rather than as a local pre-commit hook on purpose: it is
# what makes the no-terminal install path work. A module edited through the
# GitHub web editor still produces an up-to-date INSTRUCTIONS.md, so someone
# with no local clone can always copy the current block out of their fork.

on:
  push:
    branches: [main]
    paths:
      - 'defaults/**'
      - 'install.sh'
      - 'build-site.sh'
      - '.github/workflows/generate-instructions.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-instructions
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate generated artifacts
        run: |
          ./install.sh --print > INSTRUCTIONS.md
          ./install.sh --brief > INSTRUCTIONS-brief.md
          ./build-site.sh

      - name: Commit if changed
        run: |
          if git diff --quiet -- INSTRUCTIONS.md INSTRUCTIONS-brief.md docs/index.html; then
            echo "::notice::Generated instructions are already current — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INSTRUCTIONS.md INSTRUCTIONS-brief.md docs/index.html
          git commit -m "Regenerate instruction artifacts from defaults/"
          git push
